<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Monitor ESP32</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

body{
  background:#121212;
  color:white;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  background:#1e1e1e;
  padding:30px;
  border-radius:15px;
  text-align:center;
  width:300px;
}

.valor{
  font-size:40px;
  margin:20px 0;
}

</style>

</head>
<body>

<div class="box">

  <h1>ESP32 DHT11</h1>

  <h2>Temperatura</h2>
  <div class="valor" id="temp">
    -- °C
  </div>

  <h2>Umidade</h2>
  <div class="valor" id="umi">
    -- %
  </div>

</div>

<script>

const client = mqtt.connect(
  'ws://broker.hivemq.com:8884/mqtt'
);

client.on('connect', () => {

  console.log("MQTT conectado");

  client.subscribe("esp32/temperatura");
  client.subscribe("esp32/umidade");
});

client.on('message', (topic, message) => {

  const valor = message.toString();

  if(topic == "esp32/temperatura"){

    document.getElementById("temp")
      .innerText = valor + " °C";
  }

  if(topic == "esp32/umidade"){

    document.getElementById("umi")
      .innerText = valor + " %";
  }
});

</script>

</body>
</html>
