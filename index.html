<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESP32 MQTT</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

body{
    background:#121212;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.box{
    background:#1e1e1e;
    padding:30px;
    border-radius:15px;
    width:350px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.valor{
    font-size:40px;
    margin-bottom:20px;
}

button{
    width:140px;
    height:55px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    margin:10px;
}

.on{
    background:#00c853;
    color:white;
}

.off{
    background:#d50000;
    color:white;
}

.status{
    margin-top:20px;
    font-size:18px;
}

.online{
    color:#00ff88;
}

.offline{
    color:#ff4444;
}

</style>
</head>
<body>

<div class="box">

    <h1>ESP32 MQTT</h1>

    <h2>Temperatura</h2>

    <div class="valor" id="temp">
        -- °C
    </div>

    <h2>Umidade</h2>

    <div class="valor" id="umi">
        -- %
    </div>

    <hr>

    <h2>Controle do LED</h2>

    <button class="on" onclick="ligarLed()">
        LIGAR
    </button>

    <button class="off" onclick="desligarLed()">
        DESLIGAR
    </button>

    <div class="status offline" id="status">
        DESCONECTADO MQTT
    </div>

</div>

<script>

const statusDiv =
    document.getElementById("status");

const client = mqtt.connect(
    'ws://broker.hivemq.com:8000/mqtt',
    {
        clientId:
            'web_' +
            Math.random().toString(16).substr(2,8),

        clean:true,

        reconnectPeriod:2000,

        connectTimeout:4000
    }
);

client.on('connect', () => {

    console.log("MQTT conectado");

    statusDiv.innerText =
        "CONECTADO MQTT";

    statusDiv.classList.remove("offline");
    statusDiv.classList.add("online");

    // Tópicos do DHT11
    client.subscribe("esp32/temperatura");
    client.subscribe("esp32/umidade");
});

client.on('reconnect', () => {

    statusDiv.innerText =
        "RECONECTANDO MQTT";

    statusDiv.classList.remove("online");
    statusDiv.classList.add("offline");
});

client.on('offline', () => {

    statusDiv.innerText =
        "MQTT OFFLINE";

    statusDiv.classList.remove("online");
    statusDiv.classList.add("offline");
});

client.on('error', (err) => {

    console.log(err);

    statusDiv.innerText =
        "ERRO MQTT";

    statusDiv.classList.remove("online");
    statusDiv.classList.add("offline");
});

client.on('message', (topic, message) => {

    const valor = message.toString();

    console.log(topic + ": " + valor);

    if(topic === "esp32/temperatura"){

        document.getElementById("temp")
            .innerText = valor + " °C";
    }

    if(topic === "esp32/umidade"){

        document.getElementById("umi")
            .innerText = valor + " %";
    }
});

// BOTÕES DO LED

function ligarLed(){

    client.publish(
        "esp32/led",
        "ON"
    );

    console.log("LED ON");
}

function desligarLed(){

    client.publish(
        "esp32/led",
        "OFF"
    );

    console.log("LED OFF");
}

</script>

</body>
</html>
