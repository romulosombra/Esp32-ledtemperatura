<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle ESP32</title>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    body{
      background:#111;
      color:white;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .box{
      text-align:center;
    }

    button{
      width:200px;
      height:60px;
      font-size:20px;
      margin:10px;
      border:none;
      border-radius:10px;
      cursor:pointer;
    }

    .on{
      background:green;
      color:white;
    }

    .off{
      background:red;
      color:white;
    }
  </style>
</head>
<body>

<div class="box">

  <h1>ESP32 MQTT</h1>

  <button class="on" onclick="ligar()">
    LIGAR
  </button>

  <button class="off" onclick="desligar()">
    DESLIGAR
  </button>

  <h3 id="status">Conectando...</h3>

</div>

<script>

const client = mqtt.connect(
  'wss://test.mosquitto.org:8081'
);

client.on('connect', () => {

  console.log("MQTT conectado");

  document.getElementById("status")
    .innerText = "MQTT CONECTADO";
});

function ligar(){

  client.publish(
    "esp32/led",
    "ON"
  );

  console.log("ON enviado");
}

function desligar(){

  client.publish(
    "esp32/led",
    "OFF"
  );

  console.log("OFF enviado");
}

</script>

</body>
</html>
